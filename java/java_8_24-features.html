Map<Boolean, List<Integer>> partitioned = nums.stream()

    case WEDNESDAY         -> 9;

record Point(int x, int y) {}

// Compiler auto-generates:
//   Point(int x, int y)  — canonical constructor
//   int x(), int y()     — accessors
//   equals(), hashCode(), toString()

Point p = new Point(3, 4);
System.out.println(p.x());   // 3
System.out.println(p);       // Point[x=3, y=4]

record Range(int min, int max) {

        if (min > max) throw new IllegalArgumentException();
    }
}

// Records implement interfaces
record Name(String first, String last)
    implements Comparable<Name> {
    public int compareTo(Name o) {
        return last.compareTo(o.last);
    }
}

// Deconstruction pattern (Java 21+)
if (obj instanceof Point(var x, var y)) {

double area(Shape s) {

// ── helpers ────────────────────────────────────────────────
function esc(str){
  return str
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function makeCard(f, searchVersion){
  const cardId = 'card-' + Math.random().toString(36).slice(2);
  const hex = f.color;
  const bg  = hex + '22';
  return `
    <div class="fcard" id="${cardId}">
      <div class="fcard-header" onclick="toggleCard('${cardId}')">
        <div class="fcard-icon" style="background:${bg};color:${f.color}">${f.icon}</div>
        <div class="fcard-text">
          ${searchVersion ? `<div style="font-size:10px;font-family:monospace;color:#f97316;margin-bottom:4px;letter-spacing:2px">${searchVersion}</div>` : ''}
          <div class="fcard-title">${esc(f.title)}</div>
          <div class="fcard-summary">${esc(f.summary)}</div>
        </div>
        <div class="fcard-toggle">code ▼</div>
      </div>
      <div class="fcard-body">
        <div class="fcard-desc">${esc(f.desc)}</div>
        <div class="code-wrap">
          <pre>${esc(f.code)}</pre>
          <button class="copy-btn" onclick="copyCode(this)">copy</button>
        </div>
      </div>
    </div>`;
}

function toggleCard(id){
  const card = document.getElementById(id);
  const isOpen = card.classList.toggle('open');
  card.querySelector('.fcard-toggle').textContent = isOpen ? 'hide ▲' : 'code ▼';
}

function copyCode(btn){
  const code = btn.previousElementSibling.textContent;
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent = '✓ copied';
    btn.classList.add('ok');
    setTimeout(()=>{ btn.textContent='copy'; btn.classList.remove('ok'); }, 1500);
  });
}

// ── build sidebar + panels ─────────────────────────────────
const sidebar  = document.getElementById('sidebar');
const panels   = document.getElementById('panels');
const srDiv    = document.getElementById('search-results');

VERSIONS.forEach((v, i) => {
  // nav item
  const nav = document.createElement('div');
  nav.className = 'nav-item' + (i===0?' active':'');
  nav.dataset.id = v.id;
  nav.innerHTML = `
    <span class="nav-badge">${v.label.split(' ')[1]}</span>
    ${v.label}
    ${v.lts?'<span class="nav-lts">LTS</span>':''}`;
  nav.onclick = () => switchTo(v.id);
  sidebar.appendChild(nav);

  // panel
  const panel = document.createElement('div');
  panel.className = 'panel' + (i===0?' active':'');
  panel.id = v.id;
  panel.innerHTML = `
    <div class="version-header">
      <div class="version-title">${v.label}</div>
      <div class="version-tags">
        ${v.lts?'<span class="tag tag-lts">LTS</span>':''}
        <span class="tag tag-date">${v.date}</span>
        <span class="tag tag-count">${v.features.length} feature${v.features.length!==1?'s':''}</span>
      </div>
    </div>
    <div class="features-list">
      ${v.features.map(f=>makeCard(f,null)).join('')}
    </div>`;
  panels.appendChild(panel);
});

function switchTo(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector(`.nav-item[data-id="${id}"]`).classList.add('active');
  srDiv.classList.remove('active');
  panels.style.display = '';
}

// ── search ─────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', function(){
  const q = this.value.trim().toLowerCase();
  if(!q){
    srDiv.classList.remove('active');
    panels.style.display = '';
    return;
  }
  panels.style.display = 'none';
  srDiv.classList.add('active');

  const hits = VERSIONS.flatMap(v =>
    v.features
      .filter(f => (f.title+f.summary+f.desc).toLowerCase().includes(q))
      .map(f => ({...f, _v: v.label}))
  );

  const countEl = document.getElementById('search-count');
  countEl.textContent = `${hits.length} result${hits.length!==1?'s':''} for "${this.value}"`;

  // remove old result cards (keep count element)
  const old = srDiv.querySelectorAll('.sr-item');
  old.forEach(el=>el.remove());

  if(hits.length===0){
    const none = document.createElement('div');
    none.className = 'sr-item';
    none.style.cssText = 'color:#64748b;font-family:monospace;font-size:13px';
    none.textContent = 'No features found.';
    srDiv.appendChild(none);
  } else {
    hits.forEach(f => {
      const wrap = document.createElement('div');
      wrap.className = 'sr-item';
      wrap.innerHTML = makeCard(f, f._v);
      srDiv.appendChild(wrap);
    });
  }
});
</script>
